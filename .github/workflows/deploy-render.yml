name: Deploy Backend su Render

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'render.yaml'

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Avvia deploy su Render
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" | \
            grep -q "200" && echo "Deploy avviato con successo" || \
            (echo "Deploy fallito" && exit 1)
